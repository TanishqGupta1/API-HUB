services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vg_pass}
      POSTGRES_DB: ${POSTGRES_DB:-vg_hub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vg_user} -d ${POSTGRES_DB:-vg_hub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    command: ["sh", "/app/bootstrap.sh"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-vg_user}:${POSTGRES_PASSWORD:-vg_pass}@postgres:5432/${POSTGRES_DB:-vg_hub}
      - SECRET_KEY=${SECRET_KEY:-y0uR_s3cr3t_k3y_h3r3}
      - API_BASE_URL=${API_BASE_URL:-http://api:8000}
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      - AUTO_SEED=${AUTO_SEED:-0}
      - SEED_ADMIN=${SEED_ADMIN:-0}
      - REDIS_URL=redis://redis:6379/0
      - OPS_PUSH_DURABLE_QUEUE=${OPS_PUSH_DURABLE_QUEUE:-1}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # arq worker — picks up push jobs enqueued via enqueue_push() and
  # executes them outside the API process so a pod restart never loses
  # a job mid-push. Same image and code as `api`; only the command
  # differs. Scale with `docker compose up --scale worker=3`.
  worker:
    build: ./backend
    command: ["arq", "worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-vg_user}:${POSTGRES_PASSWORD:-vg_pass}@postgres:5432/${POSTGRES_DB:-vg_hub}
      - SECRET_KEY=${SECRET_KEY:-y0uR_s3cr3t_k3y_h3r3}
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET:-}
      - REDIS_URL=redis://redis:6379/0
      - OPS_PUSH_CONCURRENCY=${OPS_PUSH_CONCURRENCY:-4}
      - OPS_PUSH_JOB_TIMEOUT_SECS=${OPS_PUSH_JOB_TIMEOUT_SECS:-300}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: deps
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side fetch from Next.js API routes (uses Docker DNS, not the
      # browser-visible URL).
      - API_BASE_URL=${API_BASE_URL:-http://api:8000}
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET:-}
      - NEXT_PUBLIC_PHASE8_LIVE=true
      - NEXT_PUBLIC_PHASE8_ADMIN_PROXY=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:
