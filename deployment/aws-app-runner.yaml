  # ── ECS Fargate: n8n (requires persistent storage) ───────────────────────────

  N8nCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub api-hub-n8n-${EnvironmentName}

  N8nEfs:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose

  N8nTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: N8nSecretsRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref IngestSharedSecret

  N8nExecRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  N8nTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub api-hub-n8n-${EnvironmentName}
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !GetAtt N8nTaskRole.Arn
      ExecutionRoleArn: !GetAtt N8nExecRole.Arn
      Volumes:
        - Name: n8n-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref N8nEfs
      ContainerDefinitions:
        - Name: n8n
          Image: !Ref N8nEcrImageUri
          PortMappings:
            - ContainerPort: 5678
          MountPoints:
            - SourceVolume: n8n-data
              ContainerPath: /home/node/.n8n
          Environment:
            - Name: N8N_HOST
              Value: '0.0.0.0'
            - Name: N8N_PORT
              Value: '5678'
            - Name: N8N_PROTOCOL
              Value: https
            - Name: N8N_EDITOR_BASE_URL
              Value: !Sub https://n8n.${DomainName}
            - Name: API_HUB_BASE_URL
              Value: !GetAtt ApiService.ServiceUrl
            - Name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              Value: 'false'
          Secrets:
            - Name: INGEST_SHARED_SECRET
              ValueFrom: !Ref IngestSharedSecret

# ── Conditions ────────────────────────────────────────────────────────────────

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, production]

# ── Outputs ───────────────────────────────────────────────────────────────────

Outputs:
  ApiServiceUrl:
    Description: App Runner URL for the FastAPI backend
    Value: !GetAtt ApiService.ServiceUrl
    Export:
      Name: !Sub api-hub-${EnvironmentName}-api-url

  FrontendServiceUrl:
    Description: App Runner URL for the Next.js frontend
    Value: !GetAtt FrontendService.ServiceUrl
    Export:
      Name: !Sub api-hub-${EnvironmentName}-frontend-url

  PostgresEndpoint:
    Description: RDS endpoint address
    Value: !GetAtt PostgresDb.Endpoint.Address
    Export:
      Name: !Sub api-hub-${EnvironmentName}-db-endpoint

  SecretKeyArn:
    Value: !Ref SecretKey
  IngestSecretArn:
    Value: !Ref IngestSharedSecret
  PostgresUrlSecretArn:
    Value: !Ref PostgresUrlSecret
