# AWS App Runner — API-HUB Production Deployment
#
# Two services:
#   api-hub-backend  — FastAPI on port 8000
#   api-hub-frontend — Next.js standalone on port 3000
#
# Prerequisites before applying:
#   1. Push both Docker images to ECR (see README.md for commands)
#   2. Create an RDS PostgreSQL 16 instance (or use existing)
#   3. Store secrets in AWS Secrets Manager or Parameter Store
#   4. Create an App Runner ECR access role (AWSAppRunnerECRAccessRole)
#
# Apply:
#   aws cloudformation deploy \
#     --template-file deployment/aws-app-runner.yaml \
#     --stack-name api-hub \
#     --capabilities CAPABILITY_IAM \
#     --parameter-overrides \
#         PostgresUrl=<value> \
#         SecretKey=<value> \
#         IngestSharedSecret=<value>

AWSTemplateFormatVersion: "2010-09-09"
Description: API-HUB — FastAPI backend + Next.js frontend on AWS App Runner

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  # Backend
  PostgresUrl:
    Type: String
    NoEcho: true
    Description: >
      Full asyncpg connection string, e.g.
      postgresql+asyncpg://user:pass@rds-host:5432/vg_hub

  SecretKey:
    Type: String
    NoEcho: true
    Description: >
      Fernet key for EncryptedJSON columns.
      Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"

  IngestSharedSecret:
    Type: String
    NoEcho: true
    Description: >
      Shared secret for n8n → FastAPI ingest endpoints.
      Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"

  AllowedOrigins:
    Type: String
    Default: ""
    Description: >
      Comma-separated list of CORS origins for the backend.
      e.g. https://app.yourdomain.com,https://api.yourdomain.com
      Leave blank to use the backend default (localhost only).

  # Frontend
  NextPublicApiUrl:
    Type: String
    Description: >
      Public URL of the backend service, as seen by the browser.
      e.g. https://api.yourdomain.com

  NextPublicN8nUrl:
    Type: String
    Default: ""
    Description: >
      Public URL of the n8n instance (if self-hosted).
      e.g. https://n8n.yourdomain.com

  # Images
  BackendImageUri:
    Type: String
    Description: >
      ECR image URI for the FastAPI backend.
      e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/api-hub-backend:latest

  FrontendImageUri:
    Type: String
    Description: >
      ECR image URI for the Next.js frontend.
      e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/api-hub-frontend:latest

  # Sizing
  BackendCpu:
    Type: String
    Default: "1 vCPU"
    AllowedValues: ["0.25 vCPU", "0.5 vCPU", "1 vCPU", "2 vCPU", "4 vCPU"]

  BackendMemory:
    Type: String
    Default: "2 GB"
    AllowedValues: ["0.5 GB", "1 GB", "2 GB", "3 GB", "4 GB", "6 GB", "8 GB", "10 GB", "12 GB"]

  FrontendCpu:
    Type: String
    Default: "0.25 vCPU"
    AllowedValues: ["0.25 vCPU", "0.5 vCPU", "1 vCPU", "2 vCPU", "4 vCPU"]

  FrontendMemory:
    Type: String
    Default: "0.5 GB"
    AllowedValues: ["0.5 GB", "1 GB", "2 GB", "3 GB", "4 GB", "6 GB", "8 GB", "10 GB", "12 GB"]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # --- IAM role so App Runner can pull from ECR ---
  AppRunnerECRRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ecr-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # --- Backend: FastAPI ---
  BackendService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: api-hub-backend
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref BackendImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8000"
            RuntimeEnvironmentVariables:
              POSTGRES_URL: !Ref PostgresUrl
              SECRET_KEY: !Ref SecretKey
              INGEST_SHARED_SECRET: !Ref IngestSharedSecret
              ALLOWED_ORIGINS: !Ref AllowedOrigins
              # n8n is self-hosted — set N8N_BASE_URL to your n8n instance URL
              N8N_BASE_URL: !Ref NextPublicN8nUrl
              PYTHONUNBUFFERED: "1"
      InstanceConfiguration:
        Cpu: !Ref BackendCpu
        Memory: !Ref BackendMemory
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 3
      AutoScalingConfigurationArn: !Ref BackendAutoScaling

  BackendAutoScaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: api-hub-backend-scaling
      MinSize: 1
      MaxSize: 5
      MaxConcurrency: 100

  # --- Frontend: Next.js standalone ---
  FrontendService:
    Type: AWS::AppRunner::Service
    DependsOn: BackendService
    Properties:
      ServiceName: api-hub-frontend
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref FrontendImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "3000"
            RuntimeEnvironmentVariables:
              NEXT_PUBLIC_API_URL: !Ref NextPublicApiUrl
              NEXT_PUBLIC_N8N_URL: !Ref NextPublicN8nUrl
              NODE_ENV: production
      InstanceConfiguration:
        Cpu: !Ref FrontendCpu
        Memory: !Ref FrontendMemory
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 3
      AutoScalingConfigurationArn: !Ref FrontendAutoScaling

  FrontendAutoScaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: api-hub-frontend-scaling
      MinSize: 1
      MaxSize: 3
      MaxConcurrency: 100

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  BackendUrl:
    Description: App Runner URL for the FastAPI backend
    Value: !GetAtt BackendService.ServiceUrl

  FrontendUrl:
    Description: App Runner URL for the Next.js frontend
    Value: !GetAtt FrontendService.ServiceUrl
