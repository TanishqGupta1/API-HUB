AWSTemplateFormatVersion: '2010-09-09'
Description: >
  API-HUB stack — App Runner (api + frontend), ECS Fargate (n8n),
  RDS PostgreSQL 16, Secrets Manager.

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  ApiEcrImageUri:
    Type: String
    Description: ECR image URI for the FastAPI backend (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/api-hub-api:sha-abc123)
  FrontendEcrImageUri:
    Type: String
    Description: ECR image URI for the Next.js frontend
  N8nEcrImageUri:
    Type: String
    Description: ECR image URI for n8n (use n8nio/n8n:latest if not customising)
    Default: n8nio/n8n:latest
  DomainName:
    Type: String
    Description: Base domain (e.g. staging.example.com). Subdomains api./app./n8n. will be created.
  VpcId:
    Type: AWS::EC2::VPC::Id
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: VPC CIDR block — used to restrict RDS ingress to this VPC only
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for RDS and ECS Fargate tasks
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for load balancer (n8n)
  DbUsername:
    Type: String
    Default: vg_user
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: At least 16 characters; stored in Secrets Manager

Resources:

  # ── Secrets Manager ──────────────────────────────────────────────────────────

  SecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub api-hub/${EnvironmentName}/SECRET_KEY
      Description: Fernet key for EncryptedJSON columns
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 44
        ExcludePunctuation: false

  JwtSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub api-hub/${EnvironmentName}/JWT_SECRET_KEY
      Description: HMAC-SHA256 key for JWT signing — rotate independently of the Fernet key
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 64
        ExcludePunctuation: true

  IngestSharedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub api-hub/${EnvironmentName}/INGEST_SHARED_SECRET
      Description: Shared secret for n8n → FastAPI ingest endpoints
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 48
        ExcludePunctuation: true

  PostgresUrlSecret:
    Type: AWS::SecretsManager::Secret
    DependsOn: PostgresDb
    Properties:
      Name: !Sub api-hub/${EnvironmentName}/POSTGRES_URL
      Description: Async SQLAlchemy connection string
      SecretString: !Sub
        - postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:5432/vg_hub
        - Endpoint: !GetAtt PostgresDb.Endpoint.Address

  # ── RDS PostgreSQL ────────────────────────────────────────────────────────────

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: api-hub RDS subnets
      SubnetIds: !Ref PrivateSubnetIds

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: api-hub RDS — allow Postgres from within VPC
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCidr

  PostgresDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub api-hub-${EnvironmentName}
      Engine: postgres
      EngineVersion: '16.3'
      DBInstanceClass: db.t4g.small
      AllocatedStorage: '20'
      StorageType: gp3
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      MultiAZ: !If [IsProduction, true, false]
      PubliclyAccessible: false
      BackupRetentionPeriod: !If [IsProduction, 14, 7]
      StorageEncrypted: true
      DeletionProtection: !If [IsProduction, true, false]

  # ── IAM Roles ─────────────────────────────────────────────────────────────────

  AppRunnerBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

