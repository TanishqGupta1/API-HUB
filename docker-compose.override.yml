# docker-compose.override.yml — local dev overrides.
#
# Auto-merged with docker-compose.yml when running `docker compose ...` from
# this directory. The base compose.yml is now production-shaped (multi-stage
# Dockerfile, no --reload, Next.js standalone CMD). This file restores the
# dev experience: volume-mounted source + reload CMDs + the dev-stage build
# target. Skip this file in CI/prod by passing `-f docker-compose.yml`
# explicitly.

services:
  api:
    # Dev override: bootstrap.sh seeds demo data + ensures admin user,
    # then exec's uvicorn (with --reload when UVICORN_RELOAD=1).
    command: ["sh", "/app/bootstrap.sh"]
    environment:
      - UVICORN_RELOAD=1

  frontend:
    build:
      context: ./frontend
      target: deps
    command:
      - npm
      - run
      - dev
    environment:
      - NODE_ENV=development

  # When backend runs on the host (uvicorn outside Docker) instead of in the
  # `api` container, n8n must reach it via host.docker.internal — `api:8000`
  # only resolves inside the compose network.
  n8n:
    environment:
      - API_BASE_URL=http://host.docker.internal:8000
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET}
