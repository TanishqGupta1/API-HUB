name: Deploy to ECS

# AUTO-DEPLOY DISABLED. Trigger only via manual run:
#   GitHub Actions tab → 'Deploy to ECS' → 'Run workflow' button.
# To re-enable auto-deploy on push to dev, uncomment the `push` block below.
on:
  # push:
  #   branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write   # for OIDC AWS auth
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_BACKEND: api-hub-backend
  ECR_FRONTEND: api-hub-frontend
  ECR_N8N: api-hub-n8n

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment name
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "ENV_NAME=dev" >> $GITHUB_ENV
          else
            echo "ENV_NAME=staging" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + push backend
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          SHA=${GITHUB_SHA::8}
          docker build -t $ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:$SHA ./backend
          docker push  $ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:$SHA
          echo "BACKEND_URI=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:$SHA" >> $GITHUB_ENV

      - name: Build + push frontend
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          SHA=${GITHUB_SHA::8}
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_N8N_URL=${{ vars.NEXT_PUBLIC_N8N_URL }} \
            -t $ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND:$SHA ./frontend
          docker push  $ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND:$SHA
          echo "FRONTEND_URI=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND:$SHA" >> $GITHUB_ENV

      - name: Build + push n8n
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          SHA=${GITHUB_SHA::8}
          docker build -f n8n.Dockerfile -t $ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_N8N:$SHA .
          docker push  $ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_N8N:$SHA
          echo "N8N_URI=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_N8N:$SHA" >> $GITHUB_ENV

      - name: Deploy CFN stack
        run: |
          aws cloudformation deploy \
            --template-file deployment/ecs/api-hub.yaml \
            --stack-name api-hub-$ENV_NAME \
            --region $AWS_REGION \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides $(jq -r 'map("\(.ParameterKey)=\(.ParameterValue)") | .[]' deployment/ecs/parameters/$ENV_NAME.json | tr '\n' ' ') \
              BackendImageUri=$BACKEND_URI \
              FrontendImageUri=$FRONTEND_URI \
              N8nImageUri=$N8N_URI \
            --no-fail-on-empty-changeset

      - name: Run Alembic migration
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          # Inject real values into migrate-task.json and register a task definition
          jq \
            --arg image "$BACKEND_URI" \
            --arg exec "arn:aws:iam::$ACCOUNT:role/api-hub-$ENV_NAME-EcsTaskExecutionRole" \
            --arg taskrole "arn:aws:iam::$ACCOUNT:role/api-hub-$ENV_NAME-BackendTaskRole" \
            --arg secret "arn:aws:secretsmanager:$AWS_REGION:$ACCOUNT:secret:api-hub/$ENV_NAME/POSTGRES_URL" \
            '.containerDefinitions[0].image=$image
             | .containerDefinitions[0].secrets[0].valueFrom=$secret
             | .executionRoleArn=$exec
             | .taskRoleArn=$taskrole' \
            deployment/ecs/migrate-task.json > /tmp/migrate-task.json

          aws ecs register-task-definition \
            --cli-input-json file:///tmp/migrate-task.json \
            --region $AWS_REGION

          aws ecs run-task \
            --cluster api-hub-$ENV_NAME \
            --launch-type FARGATE \
            --task-definition api-hub-migrate \
            --network-configuration "awsvpcConfiguration={subnets=[$(jq -r '.[] | select(.ParameterKey=="PrivateSubnetIds") | .ParameterValue' deployment/ecs/parameters/$ENV_NAME.json)],securityGroups=[$(aws ec2 describe-security-groups --filters Name=group-name,Values=*TaskSg* --query 'SecurityGroups[0].GroupId' --output text)],assignPublicIp=DISABLED}" \
            --region $AWS_REGION
