<svg viewBox="0 0 1040 596" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img">
<title>GraphX Connect architecture with protocols</title>
<desc>Supply sources connect to GraphX Connect over SOAP and REST via adapters. Connect holds a master catalog, per-tenant shadow catalogs, a SKU and destination map, and key-to-token auth. It exposes a canonical API to consumers over HTTP and GraphQL, serving six seams and routing orders back to suppliers as the bidirectional fulfillment seam. Principles: cost-only, idempotent, canonical model, overlay-preserving, config-only onboarding.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6475"/></marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e4d92"/></marker>
</defs>
<style>
  .t{fill:#1b2433} .s{fill:#5a6475} .m{fill:#8b939c}
  .ttl{font-weight:700}
  .box{fill:#fbfaf8;stroke:#d7dce3;stroke-width:1}
  .core{fill:#eef1f6;stroke:#1e4d92;stroke-width:1.6}
  .inner{fill:#ffffff;stroke:#cdd5e0;stroke-width:1}
  .band{fill:#f5f3f0;stroke:#d7dce3;stroke-width:1}
  .chip{fill:#fbfaf8;stroke:#d7dce3;stroke-width:1}
  .hl{fill:#fbfaf8;stroke:#1e4d92;stroke-width:1.6}
  .proto{fill:#eef1f6;stroke:#c4d0e2;stroke-width:1}
  .serve{stroke:#5a6475;stroke-width:1.6}
  .ful{stroke:#1e4d92;stroke-width:1.8}
  text{font-size:13px}
</style>

<rect x="0" y="0" width="1040" height="596" fill="#ffffff"/>

<text x="24" y="30" class="t ttl" font-size="16">GraphX Connect — Architecture</text>
<text x="318" y="30" class="m" font-size="12">→ Connect serves   ·   ↔ two-way (fulfillment)</text>

<!-- SUPPLY -->
<rect x="24" y="56" width="226" height="206" rx="10" class="box"/>
<text x="40" y="82" class="t ttl" font-size="13.5">Supply sources</text>
<text x="40" y="108" class="s" font-size="12.5">SanMar</text>
<text x="40" y="130" class="s" font-size="12.5">S&amp;S Activewear</text>
<text x="40" y="152" class="s" font-size="12.5">4Over</text>
<text x="40" y="174" class="s" font-size="12.5">994+ PromoStandards</text>
<text x="40" y="200" class="m" font-size="12">GraphX tenants</text>
<text x="40" y="218" class="m" font-size="11">(a tenant can also supply)</text>

<!-- CONNECT CORE -->
<rect x="314" y="44" width="412" height="230" rx="12" class="core"/>
<text x="330" y="72" class="t ttl" font-size="15">GraphX Connect — canonical API</text>
<rect x="330" y="86" width="184" height="74" rx="8" class="inner"/>
<text x="344" y="112" class="t ttl" font-size="13">Master catalog</text>
<text x="344" y="132" class="s" font-size="11.5">canonical, all suppliers</text>
<rect x="526" y="86" width="184" height="74" rx="8" class="inner"/>
<text x="540" y="112" class="t ttl" font-size="13">Shadow catalogs</text>
<text x="540" y="132" class="s" font-size="11.5">per-tenant · curated + cost</text>
<rect x="330" y="172" width="184" height="74" rx="8" class="inner"/>
<text x="344" y="198" class="t ttl" font-size="13">SKU + destination map</text>
<text x="344" y="218" class="s" font-size="11.5">unambiguous routing back</text>
<rect x="526" y="172" width="184" height="74" rx="8" class="inner"/>
<text x="540" y="198" class="t ttl" font-size="13">Auth</text>
<text x="540" y="218" class="s" font-size="11.5">key → short-lived token</text>

<!-- CONSUMERS -->
<rect x="790" y="56" width="226" height="206" rx="10" class="box"/>
<text x="806" y="82" class="t ttl" font-size="13.5">Consumers / tenants</text>
<text x="806" y="108" class="s" font-size="12.5">Manage (first)</text>
<text x="806" y="130" class="s" font-size="12.5">OnPrintShop — GraphQL</text>
<text x="806" y="152" class="s" font-size="12.5">Shopify</text>
<text x="806" y="174" class="s" font-size="12.5">WooCommerce</text>
<text x="806" y="200" class="m" font-size="11">each keeps its own</text>
<text x="806" y="216" class="m" font-size="11">shadow catalog</text>

<!-- serve arrows + protocol labels -->
<line x1="252" y1="138" x2="312" y2="138" class="serve" marker-end="url(#arr)"/>
<rect x="240" y="148" width="84" height="22" rx="6" class="proto"/>
<text x="282" y="163" text-anchor="middle" class="t" font-size="11.5">SOAP / REST</text>
<text x="282" y="186" text-anchor="middle" class="m" font-size="10">via adapters</text>

<line x1="728" y1="138" x2="788" y2="138" class="serve" marker-end="url(#arr)"/>
<rect x="714" y="148" width="100" height="22" rx="6" class="proto"/>
<text x="764" y="163" text-anchor="middle" class="t" font-size="11.5">HTTP / GraphQL</text>
<text x="764" y="186" text-anchor="middle" class="m" font-size="10">canonical</text>

<!-- fulfillment return path -->
<line x1="903" y1="294" x2="520" y2="294" class="ful"/>
<line x1="520" y1="294" x2="137" y2="294" class="ful" marker-end="url(#arrA)"/>
<line x1="520" y1="274" x2="520" y2="294" class="ful"/>
<text x="520" y="312" text-anchor="middle" class="t" font-size="12">Order fulfillment — consumer → Connect → supplier (the only two-way seam)</text>

<!-- SEAMS BAND -->
<rect x="24" y="332" width="992" height="138" rx="10" class="band"/>
<text x="40" y="356" class="t ttl" font-size="13.5">Seven integration seams</text>
<g>
<rect x="40" y="370" width="128" height="84" rx="8" class="chip"/><text x="104" y="404" text-anchor="middle" class="t ttl" font-size="12.5">Catalog</text><text x="104" y="424" text-anchor="middle" class="m" font-size="11">products · cost →</text>
<rect x="178" y="370" width="128" height="84" rx="8" class="chip"/><text x="242" y="404" text-anchor="middle" class="t ttl" font-size="12.5">Inventory</text><text x="242" y="424" text-anchor="middle" class="m" font-size="11">stock →</text>
<rect x="316" y="370" width="128" height="84" rx="8" class="chip"/><text x="380" y="404" text-anchor="middle" class="t ttl" font-size="12.5">Pricing</text><text x="380" y="424" text-anchor="middle" class="m" font-size="11">daily refresh →</text>
<rect x="454" y="370" width="128" height="84" rx="8" class="hl"/><text x="518" y="400" text-anchor="middle" class="t ttl" font-size="12.5">Fulfillment</text><text x="518" y="420" text-anchor="middle" class="s" font-size="11">order ↔</text><text x="518" y="437" text-anchor="middle" class="m" font-size="10">two-way</text>
<rect x="592" y="370" width="128" height="84" rx="8" class="chip"/><text x="656" y="404" text-anchor="middle" class="t ttl" font-size="12.5">Status</text><text x="656" y="424" text-anchor="middle" class="m" font-size="11">shipped · track →</text>
<rect x="730" y="370" width="128" height="84" rx="8" class="chip"/><text x="794" y="404" text-anchor="middle" class="t ttl" font-size="12.5">Images</text><text x="794" y="424" text-anchor="middle" class="m" font-size="11">per-colour →</text>
<rect x="868" y="370" width="128" height="84" rx="8" class="chip"/><text x="932" y="404" text-anchor="middle" class="t ttl" font-size="12.5">Directory</text><text x="932" y="424" text-anchor="middle" class="m" font-size="11">suppliers →</text>
</g>

<!-- PRINCIPLES -->
<rect x="24" y="486" width="992" height="84" rx="10" class="band"/>
<text x="40" y="510" class="t ttl" font-size="13.5">Principles</text>
<g>
<rect x="40" y="522" width="184" height="34" rx="7" class="chip"/><text x="132" y="544" text-anchor="middle" class="s" font-size="12">Cost only</text>
<rect x="234" y="522" width="184" height="34" rx="7" class="chip"/><text x="326" y="544" text-anchor="middle" class="s" font-size="12">Idempotent</text>
<rect x="428" y="522" width="184" height="34" rx="7" class="chip"/><text x="520" y="544" text-anchor="middle" class="s" font-size="12">Canonical model</text>
<rect x="622" y="522" width="184" height="34" rx="7" class="chip"/><text x="714" y="544" text-anchor="middle" class="s" font-size="12">Overlay-preserving</text>
<rect x="816" y="522" width="200" height="34" rx="7" class="chip"/><text x="916" y="544" text-anchor="middle" class="s" font-size="12">Config-only onboarding</text>
</g>
</svg>
